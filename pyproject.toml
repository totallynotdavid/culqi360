[project]
name = "culqi360-scripts"
version = "0.0.0"
description = "Data conversion and benchmark helper scripts"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.20", "ruff>=0.15"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
src = ["ops/bench", "tools/data-conversion"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["ops/bench", "tools/data-conversion"]
