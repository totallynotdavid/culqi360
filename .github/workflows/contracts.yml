name: contracts

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "tools/codegen/**"
      - "crates/leads/src/contracts_generated.rs"
      - "crates/search/src/*_contract_generated.rs"
      - "apps/web/src/contracts/**/*.generated.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "tools/codegen/**"
      - "crates/leads/src/contracts_generated.rs"
      - "crates/search/src/*_contract_generated.rs"
      - "apps/web/src/contracts/**/*.generated.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/contracts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: Contract sync
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: check generated contracts
        run: bun run check:contracts

      - name: check search contract
        run: bun run check:search-contract
