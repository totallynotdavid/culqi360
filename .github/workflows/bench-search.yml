name: bench search

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
      operation:
        description: "Benchmark operation"
        required: true
        default: "gate"
        type: choice
        options:
          - gate
          - bootstrap
      refresh_dataset:
        description: "Refresh dataset state before benchmarking"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: search benchmark
    runs-on: [self-hosted, linux, bench-selfhosted]
    timeout-minutes: 120

    env:
      BENCH_ROOT: /srv/crm/bench
      MODE: ${{ inputs.mode }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BASELINE_PATH: /srv/crm/bench/baselines/${{ inputs.mode }}.json

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.0
        with:
          install_args: rust python

      - name: build benchmark binary
        shell: bash
        run: mise run build:bench-search

      - name: build pipeline binary
        if: ${{ inputs.refresh_dataset && inputs.mode == 'smoke' }}
        shell: bash
        run: mise run build:pipeline

      - name: refresh smoke dataset
        if: ${{ inputs.refresh_dataset && inputs.mode == 'smoke' }}
        shell: bash
        run: |
          DATASET_VERSION="${{ github.run_id }}-${{ github.run_attempt }}-smoke" \
          PIPELINE_BIN="$PWD/target/release/pipeline" \
          BENCH_ROOT="$BENCH_ROOT" \
          bash ops/bench/build_smoke_dataset.sh

      - name: refresh full manifest
        if: ${{ inputs.refresh_dataset && inputs.mode == 'full' }}
        shell: bash
        run: |
          DATASET_VERSION="${{ github.run_id }}-${{ github.run_attempt }}-full" \
          BENCH_ROOT="$BENCH_ROOT" \
          bash ops/bench/update_full_manifest.sh

      - name: require existing baseline for gate
        if: ${{ inputs.operation == 'gate' }}
        shell: bash
        run: |
          if [[ ! -f "$BASELINE_PATH" ]]; then
            echo "missing baseline for gate: $BASELINE_PATH" >&2
            echo "run operation=bootstrap first for this mode" >&2
            exit 1
          fi

      - name: run benchmark
        id: run_bench
        shell: bash
        run: |
          strict=0
          report_path="$BENCH_ROOT/runs/${MODE}-${RUN_ID}.json"
          if [[ "${{ inputs.operation }}" == "gate" ]]; then
            strict=1
            report_path="$BENCH_ROOT/runs/${MODE}-${RUN_ID}-gate.json"
          fi
          MODE="$MODE" \
          STRICT_BASELINE="$strict" \
          BASELINE_PATH="$BASELINE_PATH" \
          RUN_ID="$RUN_ID" \
          BENCH_SEARCH_BIN="$PWD/target/release/bench-search" \
          OUTPUT_PATH="$report_path" \
          bash ops/bench/run_benchmark.sh
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"

      - name: copy benchmark report for artifact
        shell: bash
        run: |
          cp "${{ steps.run_bench.outputs.report_path }}" "target/bench-search-report-${MODE}.json"

      - name: upload benchmark report
        uses: actions/upload-artifact@v7.0.2
        with:
          name:
            bench-search-${{ inputs.mode }}-${{ inputs.operation }}-${{
            github.run_id }}-${{ github.run_attempt }}
          path: target/bench-search-report-${{ inputs.mode }}.json
          if-no-files-found: error
          retention-days: 30

      - name: promote baseline
        if: ${{ inputs.operation == 'bootstrap' }}
        shell: bash
        run: |
          bash ops/bench/promote_baseline.sh "${{ steps.run_bench.outputs.report_path }}" "$BASELINE_PATH"

      - name: upload promoted baseline
        if: ${{ inputs.operation == 'bootstrap' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name:
            bench-baseline-${{ inputs.mode }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ env.BASELINE_PATH }}
          if-no-files-found: error
          retention-days: 30
