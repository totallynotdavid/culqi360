name: CodSpeed

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: build email templates
        run: bun run --cwd packages/email-composer build:emails

      - name: run benchmarks
        uses: CodSpeedHQ/action@v5.4.2
        with:
          mode: simulation
          run: bun run test:perf
          working-directory: apps/web
