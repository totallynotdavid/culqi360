name: CodSpeed

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  MISE_DISABLE_TOOLS: postgres

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: install dependencies
        run: mise run install

      - name: run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: mise run test:perf
