name: CodSpeed

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/src/lib/**"
      - "apps/web/src/server/**"
      - "apps/web/tests/bench/**"
      - "apps/web/vitest.bench.config.ts"
      - "apps/web/package.json"
      - "packages/email-composer/src/**"
      - "packages/email-composer/package.json"
      - "packages/message-channels/src/**"
      - "packages/message-channels/package.json"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  MISE_DISABLE_TOOLS: postgres

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.0

      - run: mise run install

      - name: run benchmarks
        uses: CodSpeedHQ/action@v5.4.2
        with:
          mode: simulation
          run: mise run test:perf
