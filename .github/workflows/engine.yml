name: engine

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/engine.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/engine.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: clippy
        run: bun run lint:engine

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SESSION_SECRET: ci-session-secret
      ENGINE_HMAC_SECRET: ci-engine-hmac-secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: test
        run: bun run test:engine
