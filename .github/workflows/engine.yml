name: engine

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/engine.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/engine.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: clippy
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SESSION_SECRET: ci-session-secret
      ENGINE_HMAC_SECRET: ci-engine-hmac-secret

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: test
        run: cargo test -p engine
