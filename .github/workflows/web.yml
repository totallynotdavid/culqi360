name: web

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - "master"
    paths:
      - "apps/web/src/**"
      - "apps/web/tests/**"
      - "apps/web/*.ts"
      - "apps/web/*.json"
      - "apps/web/*.css"
      - "packages/email-composer/**"
      - "packages/message-channels/**"
      - "scripts/*.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/src/**"
      - "apps/web/tests/**"
      - "apps/web/*.ts"
      - "apps/web/*.json"
      - "apps/web/*.css"
      - "packages/email-composer/**"
      - "packages/message-channels/**"
      - "scripts/*.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare generated artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run generate:templates

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-generated-artifacts
          if-no-files-found: error
          path: packages/email-composer/src/templates/compiled/**

  format:
    name: Format check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: check format
        run: bun run check:format:ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-generated-artifacts
          path: packages/email-composer/src/templates/compiled

      - name: lint
        run: bun run check:lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-generated-artifacts
          path: packages/email-composer/src/templates/compiled

      - name: type check
        working-directory: apps/web
        run: bun run check:types

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-generated-artifacts
          path: packages/email-composer/src/templates/compiled

      - name: build
        working-directory: apps/web
        env:
          ENGINE_HMAC_KEY_ID: web
          ENGINE_HMAC_SECRET: ci-build-engine-hmac-secret-7Kp4xQ9m2Vw8
          GOOGLE_CLIENT_ID: ci-build-client
          GOOGLE_CLIENT_SECRET: ci-build-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
          NOTIFICATION_ROUTES: ""
          SESSION_SECRET: ci-build-session-secret-4Nq8vR2m7Kx5
          TOTP_ENCRYPTION_KEY: ci-build-totp-encryption-key-9Wp3mK7xQ2v8
          WEB_DB_URL: postgres://postgres@localhost:5432/crm
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-build-webhook-token-6Kr9mQ2xV7p4
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-generated-artifacts
          path: packages/email-composer/src/templates/compiled

      - name: test
        working-directory: apps/web
        run: bun run test

  perf-test:
    name: Perf test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: prepare

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-generated-artifacts
          path: packages/email-composer/src/templates/compiled

      - name: perf test
        working-directory: apps/web
        run: bun run test:perf
