name: rust quality

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "crates/pipeline/src/**"
      - "crates/pipeline/tests/**"
      - "crates/pipeline/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/rust-quality.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "crates/pipeline/src/**"
      - "crates/pipeline/tests/**"
      - "crates/pipeline/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/rust-quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: check format
        run: cargo fmt --all --check
