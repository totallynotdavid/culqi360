[paths]
manifest = "crates/pipeline/data/mappings/source-manifest.json"
raw_dir = "crates/pipeline/data/raw"
normalized_dir = "crates/pipeline/data/normalized"
staged_db = "crates/pipeline/data/build/staged/contacts.pipeline.staged.sqlite"
bench_dir = "crates/pipeline/data/build/bench"
engine_db = "crates/engine/data/contacts.sqlite"

[profiles.quick]
mode = "sample"
workers = 4
row_cap = 10000
batch_size = 50000
include_osiptel = false

[profiles.standard]
mode = "sample"
workers = 4
row_cap = 100000
batch_size = 50000
include_osiptel = false

[profiles.heavy]
mode = "sample"
workers = 8
row_cap = 100000
batch_size = 100000
include_osiptel = true
source_row_caps = { osiptel = 100000 }

[profiles.full]
mode = "full"
workers = 8
batch_size = 100000
include_osiptel = true
