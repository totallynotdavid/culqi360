[alias]
xtask-check = "check --workspace --quiet"
xtask-fmt = "fmt --all --check"
xtask-clippy = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--quiet",
  "--",
  "-D",
  "warnings",
]
xtask-clippy-engine = [
  "clippy",
  "-p",
  "engine",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
xtask-clippy-pipeline = [
  "clippy",
  "-p",
  "pipeline",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
xtask-format = "fmt --all"
